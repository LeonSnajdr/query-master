$schema: https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
import: ["@cspell/dict-de-de"]
enabled: true

files:
  - i18n/locales/de/de.json
  - i18n/locales/en/en.json
  # Everything else in the repository is English: the docs are checked as English.
  - docs/**/*.md
  - ../../README.md

dictionaryDefinitions:
  - name: custom.de
    addWords: true
    path: .cspell/custom.de.dict

  - name: custom.en
    addWords: true
    path: .cspell/custom.en.dict

patterns:
  - name: translationKey
    pattern: '/"([0-9A-Za-z_-]+[.])+([0-9A-Za-z_-])+"/'
  - name: placeholder
    pattern: "/{.*?}/"

overrides:
  - filename: "**/*.md"
    language: en
    dictionaries: [custom.en, softwareTerms, typescript, node, rust, bash, powershell, html, css]

  - filename: i18n/locales/en/en.json
    language: en
    dictionaries: [custom.en, softwareTerms, typescript, node]
    ignoreRegExpList: [translationKey, placeholder]

  - filename: i18n/locales/de/de.json
    language: de
    dictionaries: [custom.de, custom.en, softwareTerms, typescript, node]
    ignoreRegExpList: [translationKey, placeholder]
